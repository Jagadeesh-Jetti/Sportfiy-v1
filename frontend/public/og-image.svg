<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0f1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0f1c"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(80,180)">
    <rect width="80" height="80" rx="20" fill="#84cc16"/>
    <text x="40" y="58" font-family="Inter, sans-serif" font-size="50" font-weight="900" fill="#0a0f1c" text-anchor="middle">S</text>
  </g>
  <text x="80" y="350" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Find your court.</text>
  <text x="80" y="430" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Book your slot.</text>
  <text x="80" y="510" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="url(#lime)" letter-spacing="-2">Play your game.</text>
  <text x="80" y="570" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" letter-spacing="3">SPORTIFY · BENGALURU · HYDERABAD</text>
</svg>
